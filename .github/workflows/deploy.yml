name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les poussées rapprochées annulent la précédente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:pages
        env:
          # Ces deux valeurs sont inscrites dans le JavaScript au moment du
          # build : elles sont donc publiques de toute façon, et la clé
          # publiable est précisément conçue pour vivre dans un navigateur.
          # Ce sont les règles d'accès de la base qui protègent les données.
          # Une clé secrète, elle, n'aurait rien à faire ici : elle passerait
          # par un secret de dépôt, jamais par ce fichier.
          VITE_SUPABASE_URL: https://nskbsohzkxdnggpxwcjv.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_Xhqbu8KFubwzJ4MOKxlVSw_uRft88ui

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
